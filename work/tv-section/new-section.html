<section class="tv-story" id="typica-tv" aria-labelledby="tv-title">
  <div class="tv-stage">
    <div class="tv-art">
    <div class="tv-screen" role="group" aria-label="Vídeo de ejemplo en el televisor">
      <video id="typica-tv-video" controls muted loop playsinline preload="none" poster="assets/tv-section/typica-tv-poster.jpg" aria-label="Vídeo de café proporcionado como ejemplo">
        <source src="assets/tv-section/typica-tv.mp4" type="video/mp4">
        Tu navegador no puede reproducir este vídeo.
      </video>
    </div>
      <img class="tv-set-image" src="assets/tv-section/television-overlay.png" alt="" width="1672" height="941" loading="lazy">
      <img class="tv-decoration tv-decoration-hand" src="assets/stickers/Frame-6.svg" alt="" width="104" height="134">
      <img class="tv-decoration tv-decoration-hundred" src="assets/stickers/Frame.svg" alt="" width="145" height="138">
    </div>
    <div class="tv-wall-stickers" aria-hidden="true">
      <img class="tv-decoration tv-decoration-smile" src="assets/stickers/Frame-3.svg" alt="" width="128" height="128">
      <img class="tv-decoration tv-decoration-heart" src="assets/stickers/Frame-4.svg" alt="" width="92" height="157">
    </div>
    <h2 class="tv-heading" id="tv-title"><span>Esto no se cuenta</span><span>Se vive</span></h2>
    <button class="film-sound tv-sound" data-tv-sound hidden aria-label="Activar sonido" aria-pressed="false"><span class="sound-sticker"><img class="sound-shape" src="assets/stickers/truus.co-17.svg" alt=""><img class="sound-off" src="assets/stickers/truus.co-3.svg" alt=""><img class="sound-on" src="assets/stickers/truus.co-4.svg" alt=""></span><span class="sr-only">Activar o desactivar sonido</span></button><div class="film-controls tv-controls" role="group" aria-label="Controles del vídeo" hidden><button data-tv-play aria-label="Reproducir vídeo del televisor" title="Reproducir vídeo"><span class="film-label sr-only">Reproducir vídeo</span><svg class="film-symbol" viewBox="0 0 24 24" aria-hidden="true"><path class="film-play" d="m8 5 11 7-11 7Z" fill="currentColor"/></svg><img class="film-pause" src="assets/stickers/truus.co-10.svg" alt=""></button><button data-tv-fullscreen aria-label="Ver vídeo en pantalla completa" title="Pantalla completa"><img src="assets/stickers/truus.co-12.svg" alt=""></button></div>
    <button class="tv-invitation" type="button"><span>Desliza y entra<br>en nuestro mundo.</span><svg viewBox="0 0 22 42" fill="none" aria-hidden="true"><path d="M11 1v38M2 30l9 10 9-10" stroke="currentColor" stroke-width="1.25"/></svg></button>
    <span class="tv-status" role="status" aria-live="polite"></span>
  </div>
</section>
